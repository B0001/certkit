[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certkit"
version = "0.1.0"
description = "Certificate format and independent checker for numerical claims"
requires-python = ">=3.9"
dependencies = []          # the checker has none, by design

[project.optional-dependencies]
producer = ["numpy>=1.24", "scipy>=1.10"]
dev = ["pytest>=7", "numpy>=1.24", "scipy>=1.10"]

[project.scripts]
certkit = "certkit.cli:main"

[tool.setuptools.packages.find]
include = ["certkit*"]

[tool.pytest.ini_options]
pythonpath = ["."]

# The worker loop itself lives in the verified-sandbox package (installed with
# `uv tool install --editable`, deliberately NOT a dependency of this project --
# the checker's `dependencies = []` is the point of the repo). Only what
# genuinely differs per repo lives here; see that package's README for every key.
[tool.sandbox]
# certkit-jcb asks for an independent human to read interval.py and
# backward_error.py against their derivations. A worker reviewing code written
# by a model is not an independent reviewer, and closing it would destroy the
# only record that the soundness argument is unreviewed. Never dispatch it.
#
# certkit-ph1: six worker sessions have each re-confirmed the coverage cliff
# is infeasible for every named approach (matvec-oracle lower bound proven;
# term-count / banded / FEAST / fill-reducing all ruled out by computation).
# It needs a human close-or-rescope call, not more worker-hours.
park = ["certkit-jcb", "certkit-ph1"]

# The Lean beads (8y2.*) need a toolchain the image does not carry. Without a
# persistent volume every worker re-downloads elan and mathlib and throws it
# away at session end -- that is where four days of the Aug 22 run went.
# The elan volume covers only the toolchain. mathlib's 7.5G build tree is the
# other half, and it needs its own volume rather than falling through to the
# bind-mounted host tree: the host builds into lean/.lake too, and two lake
# builds sharing one tree fight over traces. One volume is still shared by all
# workers, so this separates host from workers, not workers from each other.
volumes = [
    "claude-elan:/home/node/.elan",
    "claude-certkit-lake:/workspace/lean/.lake",
]

# Per-run dispatch cap (default 25), not a concurrency limit -- the loop is
# already serial. A short leash so a run stops for human review instead of
# churning the whole queue. Counts dispatches, so a bead that comes back
# unfinished burns more than one; MAX_ATTEMPTS parks it after 2 retries.
max-workers = 5

[tool.sandbox.env]
# The Lean toolchain lives in the claude-elan volume, but elan puts its PATH
# line in ~/.bashrc -- which is in the container's ephemeral layer and is wiped
# every session, while the volume persists. Without this the 3GB toolchain is
# present and invisible, and the worker re-installs it. Rest of the value is
# the claude image's own default PATH, unchanged.
PATH = "/home/node/.elan/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
